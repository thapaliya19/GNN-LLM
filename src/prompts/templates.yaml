templates:
  default: |
      You are assisting with node-level classification in a {graph_type}.
      You will be given:
      - The target node's original description (if any)
      - A topological summary
      - A few in-context examples (for style/reference only)

      You MUST choose candidate classes **only** from this list:
      {allowed_class_names}

      ### Target Node
      Original Description:
      {original_description}

      Topological Summary:
      {topological_description}

      ### In-Context Examples (reference only)
      {examples_block}

      ### Instructions
      - First, rewrite the target node's description so it is clearer, more informative, and discriminative.
      - Do NOT invent facts; base everything on the inputs.
      - Then propose the top-{topk} most likely classes (from the allowed list), with brief rationales grounded in the node text/topology.
      - Assign each candidate a confidence in [0, 1]. Confidences do not need to sum to 1 but must be plausible.

      Provide the updated descriptions in one paragraph, no bullet points, less than 500 words.