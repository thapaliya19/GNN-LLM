templates:
  default: |
    You are rewriting node descriptions to improve performance of a graph-based classifier.
    Each node is from a {graph_type}.
    {class_hint_prefix}

    ### Target Node
    Original Description:
    {original_description}

    Topological Summary:
    {topological_description}

    {target_history_block}

    ### The following are some example nodes in the training set that you can use for reference only to understand how different text descriptions perform under the GNN.
    {examples_block}

    ### Instructions
    - Rewrite the target node's description so it is clearer, more informative, and discriminative.
    - Use the provided original description if available; otherwise, synthesize a meaningful description from the topology and neighbor summaries.
    - Use the example nodes as guidance.
    - Use ONLY the provided inputs (do not invent labels).
    - Keep style natural; write in less than 200 words.
    {class_hint_suffix}

    Provide the updated descriptions in one paragraph, no bullet points, less than 200 words.

  default_with_neighbors_kp: |
    You are rewriting node descriptions to improve performance of a graph-based classifier.
    Each node is from a {graph_type}.
    The possible classes are: {classes}
    {class_hint_prefix}

    ### Target Node
    Original Description:
    {original_description}

    Topological Summary:
    {topological_description}

    ### Connected Neighbors (key topics)
    The following are key topics of nodes directly connected to the target node:
    {neighbor_context}

    {target_history_block}

    ### The following are some example nodes in the training set that you can use for reference only to understand how different text descriptions perform under the GNN.
    {examples_block}

    ### Instructions
    - Rewrite the target node's description so it is clearer, more informative, and discriminative.
    - Consider what the connected neighbors' key topics suggest about this node's likely class.
    - Output the potential {top_k_classes} most likely classes of the node and provide reasons for your assessment.
    - Use the provided original description if available; otherwise, synthesize from topology and neighbor topics.
    - Use the example nodes as guidance.
    - Use ONLY the provided inputs (do not invent labels).
    - Keep style natural; write in less than 200 words.
    {class_hint_suffix}

    Provide the updated description with class predictions in one paragraph, no bullet points, less than 200 words.

  default_with_neighbors: |
    You are rewriting node descriptions to improve performance of a graph-based classifier.
    Each node is from a {graph_type}.
    {class_hint_prefix}

    ### Target Node
    Original Description:
    {original_description}

    Topological Summary:
    {topological_description}

    ### Connected Neighbors
    The following are descriptions of nodes directly connected to the target node in the graph:
    {neighbor_context}

    {target_history_block}

    ### The following are some example nodes in the training set that you can use for reference only to understand how different text descriptions perform under the GNN.
    {examples_block}

    ### Instructions
    - Rewrite the target node's description so it is clearer, more informative, and discriminative.
    - Consider what the connected neighbors' topics suggest about this node's likely class.
    - Use the provided original description if available; otherwise, synthesize a meaningful description from the topology and neighbor information.
    - Use the example nodes as guidance.
    - Use ONLY the provided inputs (do not invent labels).
    - Keep style natural; write in less than 200 words.
    {class_hint_suffix}

    Provide the updated descriptions in one paragraph, no bullet points, less than 200 words.
