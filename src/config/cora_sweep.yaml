program: autoprompt.py          # rename if your file is different
name: cora_sweep_gcn_tta_desc
method: random                 # bayesian search; grid and random also work
metric:
  name: best/val          # the key we just added
  goal: maximize


parameters:
  # parameters are fixed
  data: 
    value: cora
  seed: 
    value: 1
  label_setting:
    value: ratio
  emb_method:
    value: TANS
  backbone:
    value: gcn
  node_text:
    value: ['title', 'abstract']
  llm: 
    value: gemma3-12b
  desc_csv:
    value: /home/ldn24004/autoprompt/output_ratio/cora/gemma3-12b/global_rewrite_cora_gemma3-12b_seed_1.csv
  desc_mode:
    value: orig_only
  topo_csv:
    value: /home/ldn24004/autoprompt/datasets/response/text_rich/cora/topo_features.csv 
  
  prompt_template:
    value: default

  # parameters to sweep over
  rewrite_iters:
    values: [1, 2, 3]
  sim_method:
    values: [weighted_sum, concat_cosine, max, product, text_only, struct_only]
  buffer_k:
    values: [5, 10, 15, 20]
  ex_block_template:
    values: [default, no_pred, terse]
